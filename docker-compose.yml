# MySQL과 애플리케이션을 함께 띄운다.
#
# 실행 전에 jar가 있어야 한다.
#   ./gradlew bootJar
#
# 실행
#   docker compose up --build              # 서버 1대 (8080)
#   docker compose --profile multi up --build   # 서버 2대 (8080, 8081)가 같은 DB를 쓴다

x-app: &app
  build: .
  environment:
    DB_URL: jdbc:mysql://db:3306/seat_reservation?connectionTimeZone=UTC
    DB_USERNAME: app
    DB_PASSWORD: app
    HOLD_TTL: ${HOLD_TTL:-PT5M}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seat_reservation
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # 컨테이너를 다시 만들어도 판매 기록이 남도록 데이터를 볼륨에 둔다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *app
    ports:
      - "127.0.0.1:8080:8080"

  app-2:
    <<: *app
    profiles: ["multi"]
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  mysql-data:
